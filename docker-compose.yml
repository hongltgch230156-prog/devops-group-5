    build: ./backend
    # TODO: Add ports, environment, depends_on, healthcheck
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=dpg-d8eolm6q1p3s739ks6e0-a.singapore-postgres.render.com
      - DB_PORT=5432
      - DB_NAME=devops_group_5_db
      - DB_USER=devops_group_5_db_user
      - DB_PASSWORD=tNSKb300yaif7h0sAjUIPGDjbMg37GLk
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # STUDENT TODO: Define postgres service
  # 3. Postgres Service
  postgres:
    image: postgres:15-alpine
    # TODO: Add environment, ports, volumes, healthcheck
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=tododb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456a@
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tododb"]
      interval: 10s
      timeout: 5s
      retries: 5

